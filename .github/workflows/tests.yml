name: Tests

# Runs the unit tests on every pull request and on every push to main, but only the suites that a change can
# affect: a change to the GUI runs no C++ test, a change to the colour code runs no fixed-point test.
#
# Which files belong to which suite is the `filters` list in the `changes` job. A new test suite needs an entry
# there, a flag in the `suites` step of `unit-tests`, and its target in the build line.
#
# The workflow itself always reports: the last job, "Tests passed", succeeds when every job that had to run
# succeeded (jobs that were skipped because nothing relevant changed do not count). Mark that one job as the
# required check, not the individual ones, which do not exist when they are skipped.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which tests are needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fpa: ${{ steps.filter.outputs.fpa }}
      request: ${{ steps.filter.outputs.request }}
      escape: ${{ steps.filter.outputs.escape }}
      interior: ${{ steps.filter.outputs.interior }}
    steps:
      - uses: actions/checkout@v4

      # A manual run has nothing to compare with: it runs every suite (see RUN_ALL in unit-tests).
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            # Files every suite depends on: how the tests are built and this workflow.
            common: &common
              - 'Visualizer/CMakeLists.txt'
              - 'Visualizer/tests/CMakeLists.txt'
              - '.github/workflows/tests.yml'
            fpa:
              - *common
              - 'Visualizer/src/math/**'
              - 'Visualizer/tests/vectors/**'
              - 'Visualizer/tests/generate_vectors.py'
              - 'Visualizer/tests/vector_loader.*'
              - 'Visualizer/tests/test_support.h'
              - 'Visualizer/tests/test_vectors.cpp'
              - 'Visualizer/tests/test_edge_cases.cpp'
              - 'Visualizer/tests/test_invariants.cpp'
              - 'Visualizer/tests/test_cross_format.cpp'
              - 'Visualizer/tests/test_random_range.cpp'
              - 'Visualizer/tests/test_known_bugs.cpp'
              - 'Visualizer/tests/test_decimal.cpp'
            request:
              - *common
              - 'Visualizer/src/Request.*'
              - 'Visualizer/src/Mode.h'
              - 'Visualizer/src/color/Palettes.h'
              - 'Visualizer/src/calculators/IterationCalculator.h'
              - 'Visualizer/src/math/**'
              - 'Visualizer/tests/test_request.cpp'
            escape:
              - *common
              - 'Visualizer/src/util/EscapeFile.*'
              - 'Visualizer/src/calculators/IterationCalculator.h'
              - 'Visualizer/tests/test_escape_file.cpp'
            interior:
              - *common
              - 'Visualizer/src/calculators/InteriorCheck.h'
              - 'Visualizer/tests/test_interior.cpp'

  unit-tests:
    name: Unit tests (${{ matrix.name }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.fpa == 'true' || needs.changes.outputs.request == 'true' ||
      needs.changes.outputs.escape == 'true' || needs.changes.outputs.interior == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitize: "OFF"
          # AddressSanitizer + UndefinedBehaviorSanitizer catch out-of-bounds writes and undefined
          # behavior that a normal build silently survives.
          - name: ASan + UBSan
            build_type: Debug
            sanitize: "ON"
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
      RUN_ALL: ${{ github.event_name == 'workflow_dispatch' }}
      RUN_FPA: ${{ needs.changes.outputs.fpa }}
      RUN_REQUEST: ${{ needs.changes.outputs.request }}
      RUN_ESCAPE: ${{ needs.changes.outputs.escape }}
      RUN_INTERIOR: ${{ needs.changes.outputs.interior }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the suites
        id: suites
        run: |
          targets=""
          add() { if [ "$RUN_ALL" = "true" ] || [ "$1" = "true" ]; then targets="$targets $2"; fi; }
          add "$RUN_FPA" fpa_tests
          add "$RUN_REQUEST" request_tests
          add "$RUN_ESCAPE" escape_file_tests
          add "$RUN_INTERIOR" interior_tests
          echo "targets=${targets# }" >> "$GITHUB_OUTPUT"
          echo "Suites to run: ${targets# }"

      - name: Configure
        run: >
          cmake -S Visualizer -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_FPA_TESTS=ON
          -DFPA_SANITIZE=${{ matrix.sanitize }}

      - name: Build tests
        run: cmake --build build --target ${{ steps.suites.outputs.targets }} --parallel

      - name: Run tests
        run: |
          status=0
          for target in ${{ steps.suites.outputs.targets }}; do
            echo "::group::$target"
            ./build/tests/"$target" || status=1
            echo "::endgroup::"
          done
          exit $status

  # The one check to require for merging. It runs even when the test jobs were skipped, and fails when one of
  # them failed or was cancelled.
  tests-passed:
    name: Tests passed
    needs: [changes, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        run: |
          echo "changes:    ${{ needs.changes.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          case "${{ needs.unit-tests.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
