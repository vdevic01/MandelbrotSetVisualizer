name: Tests

# Runs the tests on every pull request and on every push to main, but only the suites that a change can affect: a
# change to the GUI runs no C++ unit test, a change to the colour code runs no fixed-point test.
#
# Which files belong to which suite is the `filters` list in the `changes` job. A new test suite needs an entry
# there, a flag in the `suites` step of `unit-tests`, and its target in the build line. The `contract` filter is
# the integration test between the Rust backend and the renderer.
#
# The workflow itself always reports: the last job, "Tests passed", succeeds when every job that had to run
# succeeded (jobs that were skipped because nothing relevant changed do not count). Mark that one job as the
# required check, not the individual ones, which do not exist when they are skipped.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which tests are needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fpa: ${{ steps.filter.outputs.fpa }}
      request: ${{ steps.filter.outputs.request }}
      escape: ${{ steps.filter.outputs.escape }}
      interior: ${{ steps.filter.outputs.interior }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4

      # A manual run has nothing to compare with: it runs every suite (see RUN_ALL in unit-tests).
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            # Files every suite depends on: how the tests are built and this workflow.
            common: &common
              - 'Visualizer/CMakeLists.txt'
              - 'Visualizer/tests/CMakeLists.txt'
              - '.github/workflows/tests.yml'
            fpa:
              - *common
              - 'Visualizer/src/math/**'
              - 'Visualizer/tests/vectors/**'
              - 'Visualizer/tests/generate_vectors.py'
              - 'Visualizer/tests/vector_loader.*'
              - 'Visualizer/tests/test_support.h'
              - 'Visualizer/tests/test_vectors.cpp'
              - 'Visualizer/tests/test_edge_cases.cpp'
              - 'Visualizer/tests/test_invariants.cpp'
              - 'Visualizer/tests/test_cross_format.cpp'
              - 'Visualizer/tests/test_random_range.cpp'
              - 'Visualizer/tests/test_known_bugs.cpp'
              - 'Visualizer/tests/test_decimal.cpp'
            request:
              - *common
              - 'Visualizer/src/Request.*'
              - 'Visualizer/src/Mode.h'
              - 'Visualizer/src/color/Palettes.h'
              - 'Visualizer/src/calculators/IterationCalculator.h'
              - 'Visualizer/src/math/**'
              - 'Visualizer/tests/test_request.cpp'
            escape:
              - *common
              - 'Visualizer/src/util/EscapeFile.*'
              - 'Visualizer/src/calculators/IterationCalculator.h'
              - 'Visualizer/tests/test_escape_file.cpp'
            interior:
              - *common
              - 'Visualizer/src/calculators/InteriorCheck.h'
              - 'Visualizer/tests/test_interior.cpp'
            # What the app and the renderer agree on: the flags the app sends (cli_args.rs), what the renderer
            # prints and the frontend reads (renderer-output.ts), the mode dropdown, and the renderer itself.
            contract:
              - 'GUI/MandelbrotSetVisualizer/src-tauri/src/cli_args.rs'
              - 'GUI/MandelbrotSetVisualizer/src/renderer-output.ts'
              - 'GUI/MandelbrotSetVisualizer/index.html'
              - 'GUI/MandelbrotSetVisualizer/contract-tests/**'
              - 'GUI/MandelbrotSetVisualizer/package.json'
              - 'GUI/MandelbrotSetVisualizer/package-lock.json'
              - 'Visualizer/src/**'
              - 'Visualizer/CMakeLists.txt'
              - '.github/workflows/tests.yml'

  unit-tests:
    name: Unit tests (${{ matrix.name }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.fpa == 'true' || needs.changes.outputs.request == 'true' ||
      needs.changes.outputs.escape == 'true' || needs.changes.outputs.interior == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitize: "OFF"
          # AddressSanitizer + UndefinedBehaviorSanitizer catch out-of-bounds writes and undefined
          # behavior that a normal build silently survives.
          - name: ASan + UBSan
            build_type: Debug
            sanitize: "ON"
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
      RUN_ALL: ${{ github.event_name == 'workflow_dispatch' }}
      RUN_FPA: ${{ needs.changes.outputs.fpa }}
      RUN_REQUEST: ${{ needs.changes.outputs.request }}
      RUN_ESCAPE: ${{ needs.changes.outputs.escape }}
      RUN_INTERIOR: ${{ needs.changes.outputs.interior }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the suites
        id: suites
        run: |
          targets=""
          add() { if [ "$RUN_ALL" = "true" ] || [ "$1" = "true" ]; then targets="$targets $2"; fi; }
          add "$RUN_FPA" fpa_tests
          add "$RUN_REQUEST" request_tests
          add "$RUN_ESCAPE" escape_file_tests
          add "$RUN_INTERIOR" interior_tests
          echo "targets=${targets# }" >> "$GITHUB_OUTPUT"
          echo "Suites to run: ${targets# }"

      - name: Configure
        run: >
          cmake -S Visualizer -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_FPA_TESTS=ON
          -DFPA_SANITIZE=${{ matrix.sanitize }}

      - name: Build tests
        run: cmake --build build --target ${{ steps.suites.outputs.targets }} --parallel

      - name: Run tests
        run: |
          status=0
          for target in ${{ steps.suites.outputs.targets }}; do
            echo "::group::$target"
            ./build/tests/"$target" || status=1
            echo "::endgroup::"
          done
          exit $status

  # Integration test between the app and the renderer (GUI/MandelbrotSetVisualizer/contract-tests/): the real
  # renderer is run with the argument lists the Rust code builds, and the frontend's parser is run on its output.
  contract-tests:
    name: Contract tests (app and renderer)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: GUI/MandelbrotSetVisualizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GUI/MandelbrotSetVisualizer/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci

      - name: Build the renderer
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
          cmake -S Visualizer -B build-renderer -DCMAKE_BUILD_TYPE=Release
          cmake --build build-renderer --target mandelbrot_visualizer --parallel

      - name: Run the renderer with the arguments the app builds
        env:
          MANDELBROT_VISUALIZER_BIN: ${{ github.workspace }}/build-renderer/mandelbrot_visualizer
        run: |
          rustc --version
          node contract-tests/check-cli.mjs

  # The one check to require for merging. It runs even when the test jobs were skipped, and fails when one of
  # them failed or was cancelled.
  tests-passed:
    name: Tests passed
    needs: [changes, unit-tests, contract-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        run: |
          echo "changes:    ${{ needs.changes.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "contract-tests: ${{ needs.contract-tests.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          for result in "${{ needs.unit-tests.result }}" "${{ needs.contract-tests.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
